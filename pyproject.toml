[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "ndispers/__init__.py"
# source = "vcs"

[tool.hatch.build.targets.sdist]
include = [
    "/ndispers",
]

[tool.hatch.build.targets.wheel]
packages = ["ndispers"]

[project]
name = "ndispers"
dynamic = ["version"]
description = "Python package for calculating refractive index dispersion of various materials"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
authors = [
    { name = "Akihiko Shimura", email = "akhksh@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy",
]

[project.optional-dependencies]
# symbolic access to the dispersion formulas (n_expr and friends), and
# evaluating a medium that has no pre-generated module (a user subclass)
sym = ["sympy"]

[dependency-groups]
dev = ["pytest", "sympy"]
# for running examples/basic_usage.ipynb and exploring interactively;
# kept out of dev so CI's uv sync stays lean
notebook = ["matplotlib", "plotly", "ipython", "jupyterlab", "marimo"]

[project.urls]
Homepage = "https://github.com/akihiko-shimura/ndispers"
