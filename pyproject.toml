[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "ndispers/__init__.py"
# source = "vcs"

[tool.hatch.build.targets.sdist]
include = [
    "/ndispers",
]

[tool.hatch.build.targets.wheel]
packages = ["ndispers"]

[project]
name = "ndispers"
dynamic = ["version"]
description = "Refractive-index dispersion and phase matching of nonlinear/ultrafast-optics crystals and glasses, from literature Sellmeier equations"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    { name = "Akihiko Shimura", email = "akhksh@gmail.com" },
]
keywords = [
    "optics", "nonlinear optics", "ultrafast optics", "refractive index",
    "dispersion", "Sellmeier equation", "phase matching", "birefringence",
    "quasi-phase-matching", "OPO", "SHG", "SNLO", "BBO", "LBO", "KTP",
    "lithium niobate",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy",
]

[project.optional-dependencies]
# symbolic access to the dispersion formulas (n_expr and friends), and
# evaluating a medium that has no pre-generated module (a user subclass)
sym = ["sympy"]
# the semi-analytical conversion-efficiency methods (eta_sfg, eta_shg):
# scipy provides the Jacobi elliptic sn and Simpson integration
eff = ["scipy"]

[dependency-groups]
dev = ["pytest", "sympy", "scipy"]
# for running examples/basic_usage.ipynb and exploring interactively;
# kept out of dev so CI's uv sync stays lean
notebook = ["matplotlib", "plotly", "ipython", "jupyterlab", "marimo"]

[project.urls]
Homepage = "https://github.com/akihiko-shimura/ndispers"
Documentation = "https://ndispers.readthedocs.io"
Changelog = "https://github.com/akihiko-shimura/ndispers/releases"
Apps = "https://akihiko-shimura.github.io/ndispers/"
