name: pages

# Builds the browser apps to a static site and publishes it to GitHub Pages.
# The apps pin ndispers from PyPI in their PEP 723 headers, so a release has to
# reach PyPI before the deployed apps pick it up.

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:            # one deployment at a time; newer pushes win
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Export the apps to WASM
        # marimo is pinned so a deploy is reproducible and a bad marimo release
        # can be rolled back here; keep it in step with apps/*.py __generated_with
        env:
          MARIMO: "0.24.0"
        run: |
          mkdir -p site
          cp apps/index.html apps/sitemap.xml docs/assets/logo.svg site/
          for app in explorer phasematching; do
            uv run --with "marimo==$MARIMO" marimo export html-wasm "apps/$app.py" \
              -o "site/$app" --mode run
          done
          # marimo writes the placeholder description "a marimo app" into every
          # export; search results show that text, so replace it per app
          describe() {
            sed -i "s|content=\"a marimo app\"|content=\"$2\"|" "site/$1/index.html"
            grep -q "name=\"description\" content=\"$2\"" "site/$1/index.html"
          }
          describe explorer "Plot refractive index, group index, GVD, TOD, dn/dT and walk-off of nonlinear-optics crystals and glasses against wavelength, temperature or angle, in your browser."
          describe phasematching "Phase-matching angles, acceptance bandwidths, walk-off and effective nonlinearity for collinear sum-frequency generation in nonlinear crystals, in your browser."
          test -f site/explorer/index.html
          test -f site/phasematching/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
