name: pages

# Builds the browser apps to a static site and publishes it to GitHub Pages.
# The apps pin ndispers from PyPI in their PEP 723 headers, so a release has to
# reach PyPI before the deployed apps pick it up.

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:            # one deployment at a time; newer pushes win
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Export the apps to WASM
        run: |
          mkdir -p site
          cp apps/index.html site/
          for app in explorer phasematching; do
            uv run --with marimo marimo export html-wasm "apps/$app.py" \
              -o "site/$app" --mode run
          done
          test -f site/explorer/index.html
          test -f site/phasematching/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
