name: publish

# Publishes to PyPI when a version tag is pushed, e.g.
#   git tag -a v1.0.0 -m "..." && git push origin v1.0.0
#
# Authentication is by trusted publishing (OpenID Connect): PyPI is configured
# to trust this repository's `publish` workflow, so no API token is stored
# anywhere. See docs/RELEASING.md for the one-time PyPI setup.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # allows a manual run from the Actions tab

jobs:
  # Never publish something that does not pass its own tests, and never publish
  # a tag whose version disagrees with the package.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Tag must match ndispers.__version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(uv run --no-project --with . python -c "import ndispers; print(ndispers.__version__)")
          cff=$(sed -n 's/^version: //p' CITATION.cff)
          echo "tag=$tag  package=$pkg  citation=$cff"
          test "$tag" = "$pkg"
          test "$tag" = "$cff"

      - run: uv sync
      - run: uv run pytest ndispers/tests -q
      - run: uv run --with-requirements docs/requirements.txt mkdocs build --strict

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv build
      - run: uv run --with twine twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # lets you require a manual approval on PyPI releases
    permissions:
      id-token: write          # required to mint the OIDC token; nothing else is needed
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
