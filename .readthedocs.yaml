version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    # autodoc imports ndispers, so install the package itself
    - method: pip
      path: .
    - requirements: docs/requirements.txt
